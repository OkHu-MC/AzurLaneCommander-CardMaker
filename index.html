  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #202020;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .font-controls {
      background-color: #2a3442;
      border: 1px solid #445366;
      border-radius: 10px;
      padding: 15px 20px;
      width: 1000px;
      box-sizing: border-box;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 15px;
      align-items: center;
    }

    .font-controls-title {
      width: 100%;
      font-weight: bold;
      font-size: 16px;
      color: #66b2ff;
      border-bottom: 1px solid #445366;
      padding-bottom: 5px;
      margin: 0;
    }

    .font-controls-subtitle {
      width: 100%;
      font-weight: bold;
      font-size: 14px;
      color: #aaccff;
      margin: 10px 0 0 0;
      border-left: 3px solid #66b2ff;
      padding-left: 8px;
    }

    .font-controls label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      text-align: center;
    }

    .font-controls select,
    .font-controls input[type="text"],
    .font-controls input[type="color"] {
      background-color: #1a222e;
      color: #fff;
      border: 1px solid #66b2ff;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
      outline: none;
      text-align: center;
    }

    .font-controls input[type="color"] {
      padding: 0;
      width: 32px;
      height: 28px;
      cursor: pointer;
    }

    #download-btn {
      background-color: #66b2ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      margin-left: auto;
    }

    .sheet-body {
      position: relative;
      width: 1000px;
      height: 1800px;
      background: linear-gradient(135deg, #007FFF 0%, #FFFF00 100%);
      background-size: cover;
      background-position: center;
      box-sizing: border-box;
      padding: 30px;
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    #design-guide {
      position: absolute;
      top: 0;
      left: 0;
      width: 1000px;
      height: 1780px;
      background: url('layout.png') no-repeat top center;
      background-size: contain;
      opacity: 0.2;
      pointer-events: none;
      z-index: 9999;
    }

    .drop-zone {
      position: absolute;
      border: 3px dashed #66b2ff;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      overflow: hidden;
    }

    .drop-zone.dragover {
      background-color: rgba(0, 123, 255, 0.4);
    }

    #drop-zone1 { top: 30px; left: 30px; width: 360px; height: 360px; }
    #drop-zone2 { top: 495px; left: 405px; width: 570px; height: 190px; }
    #drop-zone3 { top: 1060px; left: 30px; width: 400px; height: 400px; }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .box-item {
      position: absolute;
      background-color: rgba(240, 240, 240, 0.2);
      border-radius: 12px;
      box-sizing: border-box;
      overflow: hidden;
      padding: 32px 10px 8px 10px;
      display: flex;
      flex-direction: column;
    }

    .box-item .label {
      position: absolute;
      top: 5px;
      left: 10px;
      color: inherit;
      text-decoration: underline;
      pointer-events: none;
      font-size: 20px;
      z-index: 3;
    }

    .box-item input[type="text"],
    .box-item textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: inherit;
      font-size: 18px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .box-item textarea {
      resize: none;
      text-align: left;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #faction-bg-watermark {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('layout.png') no-repeat center center;
      background-size: contain;
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      transition: background-image 0.3s ease;
    }

    .sns-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      gap: 10px;
    }

    #qrcode-display {
      background-color: #fff;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode-display img { display: block; }

    .x-id-display {
      font-size: 18px;
      font-weight: bold;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
    }

    <div class="box-item" style="top: 200px; left: 405px; width: 570px; height: 130px;">

    <div class="box-item" style="top: 350px; left: 405px; width: 570px; height: 130px;">

    <div id="drop-zone2" class="drop-zone">
      <span>ここにバナー画像を<br>ドロップ または クリック</span>
      <img id="preview2" class="preview-img" alt="プレビュー画像">

    <input type="file" id="file-input2" accept="image/*" style="display: none;">

    <div class="box-item" style="top: 700px; left: 405px; width: 570px; height: 190px;">
      <input type="text" placeholder="自由欄" id="first-label-input" style="height: 30px; font-weight: bold; text-align: left;">

    </div>

    <div class="box-item" style="top: 1060px; left: 440px; width: 540px; height: 400px;">
      <span class="label" id="box-yome-pr-label">嫁艦を推すことになったきっかけ</span>
      <textarea placeholder="自由にメッセージを入力" id="yome-pr-input"></textarea>

    <div class="box-item" style="top: 1480px; left: 410px; width: 560px; height: 140px;">
      <span class="label" id="box-message-label">ひとこと</span>
      <textarea placeholder="自由にメッセージを入力" id="personal-message-input"></textarea>

      <span class="label" id="box-appointment-label">就任日</span>
      <input type="text" placeholder="2017.9.14" id="appointment-date-input">

    <div class="box-item" style="top: 510px; left: 30px; width: 360px; height: 90px;">
      <span class="label" id="box-sea-area-label">メイン海域</span>
      <input type="text" placeholder="海域名を入力" id="sea-area-input">
    </div>

    <div class="box-item" style="top: 620px; left: 30px; width: 360px; height: 270px;">
      <div id="faction-bg-watermark"></div>
      <span class="label" id="box-faction-label">推し陣営</span>
      <input type="text" placeholder="プルダウンメニューから選択" id="faction-name-input">
    </div>

    <div class="box-item" style="top: 920px; left: 30px; width: 945px; height: 120px;">
      <span class="label" id="box-oishi-label">私の嫁艦は</span>
      <textarea placeholder="さぁここで嫁艦を紹介してください！！！" id="oishi-message-input"></textarea>
    </div>

    <div id="drop-zone3" class="drop-zone">
      <span>ここに推し艦の画像を<br>ドロップ または クリック</span>
      <img id="preview3" class="preview-img" alt="プレビュー画像">
    </div>
    <input type="file" id="file-input3" accept="image/*" style="display: none;">

    <div class="box-item" style="top: 1480px; left: 30px; width: 360px; height: 280px; padding-top: 25px;">
      <span class="label" id="box-sns-label">SNS</span>
      <div class="sns-container">
        <div id="qrcode-display"></div>
        <div class="x-id-display" id="x-id-container" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          <span id="x-id-text"></span>
        </div>
      </div>
    </div>
    <img src="project_icon.png" alt="プロジェクトアイコン" style="position: absolute; top: 1610px; left: 400px; width: 600px; height: 225px;">
  </div>

  <script>
    function setupImageDropZone(zoneId, inputId, previewId) {
      const dropZone = document.getElementById(zoneId);
      const fileInput = document.getElementById(inputId);
      const preview = document.getElementById(previewId);

      function showPreview(file) {
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            dropZone.querySelector('span').style.display = 'none';
          };
          reader.readAsDataURL(file);
        } else {
          alert('画像ファイルを指定してください。');
        }
      }

      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => showPreview(e.target.files[0]));

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => e.preventDefault());
      });

      dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) showPreview(e.dataTransfer.files[0]);
      });
    }

    setupImageDropZone('drop-zone1', 'file-input1', 'preview1');
    setupImageDropZone('drop-zone2', 'file-input2', 'preview2');
    setupImageDropZone('drop-zone3', 'file-input3', 'preview3');

    // 使用している全フォント×ウェイトの組み合わせ（Google Fontsで実際に読み込んでいるウェイトのみ）
    const FONT_SPECS = [
      '400 16px "Dela Gothic One"',
      '500 16px "M PLUS Rounded 1c"',
      '700 16px "M PLUS Rounded 1c"',
      '500 16px "Noto Sans JP"',
      '700 16px "Noto Sans JP"',
      '600 16px "Shippori Mincho"'
    ];

    // 全フォントを強制的にロード（未使用のフォントはブラウザが遅延読み込みするため、
    // 選択直後にダウンロードしても間に合うようここで先読みしておく）
    function preloadAllFonts() {
      return Promise.all(FONT_SPECS.map(spec => document.fonts.load(spec)))
        .then(() => document.fonts.ready);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Web Font読み込み完了を確実に待機
      preloadAllFonts().then(() => {
        console.log('Fonts loaded successfully.');
      });

      const bgColorTop = document.getElementById('bg-color-top');
      const bgColorBottom = document.getElementById('bg-color-bottom');
      const sheetBody = document.getElementById('sheet-body');

      function updateBackgroundGradient() {
        sheetBody.style.background = `linear-gradient(135deg, ${bgColorTop.value} 0%, ${bgColorBottom.value} 100%)`;
      }
      bgColorTop.addEventListener('input', updateBackgroundGradient);
      bgColorBottom.addEventListener('input', updateBackgroundGradient);

      const serverSelect = document.getElementById('server-select');
      const serverInput = document.getElementById('server-name-input');
      serverSelect.addEventListener('change', (e) => { serverInput.value = e.target.value; });

      const factionSelect = document.getElementById('faction-select');
      const factionInput = document.getElementById('faction-name-input');
      const factionWatermark = document.getElementById('faction-bg-watermark');

      factionSelect.addEventListener('change', (e) => {
        factionInput.value = e.target.value;
        const selectedOption = e.target.options[e.target.selectedIndex];
        const imgPath = selectedOption.getAttribute('data-img') || 'layout.png';
        factionWatermark.style.backgroundImage = `url('${imgPath}')`;
      });

      const snsUrlInput = document.getElementById('sns-url-input');
      const snsIdInput = document.getElementById('sns-id-input');
      const qrDisplay = document.getElementById('qrcode-display');
      const xIdContainer = document.getElementById('x-id-container');
      const xIdText = document.getElementById('x-id-text');
      let qrcodeObj = null;

      function updateSNSDisplay() {
        const url = snsUrlInput.value.trim();
        const idText = snsIdInput.value.trim();

        if (url) {
          qrDisplay.style.display = 'flex';
          if (!qrcodeObj) {
            qrcodeObj = new QRCode(qrDisplay, {
              text: url,
              width: 130,
              height: 130,
              colorDark : "#000000",
              colorLight : "#ffffff",
              correctLevel : QRCode.CorrectLevel.H
            });
          } else {
            qrcodeObj.clear();
            qrcodeObj.makeCode(url);
          }
        } else {
          qrDisplay.style.display = 'none';
        }

        if (idText) {
          xIdContainer.style.display = 'flex';
          xIdText.textContent = idText.startsWith('@') ? idText : `@${idText}`;
        } else {
          xIdContainer.style.display = 'none';
        }
      }
      snsUrlInput.addEventListener('input', updateSNSDisplay);
      snsIdInput.addEventListener('input', updateSNSDisplay);

      // フォント適用ロジックの修正 (!important の強制付与)
      document.querySelectorAll('.font-select').forEach((select) => {
        select.addEventListener('change', (e) => {
          const targetSelector = e.target.getAttribute('data-target');
          const target = document.querySelector(targetSelector);
          if (target) {
            const fontName = e.target.value;
            if (fontName === "") {
              target.style.removeProperty('font-family');
            } else {
              target.style.setProperty('font-family', `"${fontName}", sans-serif`, 'important');
            }
          }
        });
      });

      // 文字サイズ適用ロジックの修正
      document.querySelectorAll('.size-select').forEach((select) => {
        select.addEventListener('change', (e) => {
          const targetSelector = e.target.getAttribute('data-target');
          const target = document.querySelector(targetSelector);
          if (target) {
            const sizeVal = e.target.value;
            if (sizeVal === "") {
              target.style.removeProperty('font-size');
            } else {
              target.style.setProperty('font-size', sizeVal, 'important');
            }
          }
        });
      });

      document.getElementById('all-text-color').addEventListener('input', (e) => {
        sheetBody.style.color = e.target.value;
      });

      document.querySelectorAll('.color-select').forEach((input) => {
        input.addEventListener('input', (e) => {
          const targetSelector = e.target.getAttribute('data-target');
          const target = document.querySelector(targetSelector);
          if (target) {
            target.style.setProperty('color', e.target.value, 'important');
          }
        });
      });

      // 保存処理
      const downloadBtn = document.getElementById('download-btn');
      downloadBtn.addEventListener('click', async () => {
        const originalBtnText = downloadBtn.textContent;
        downloadBtn.disabled = true;
        downloadBtn.textContent = 'フォント読み込み中...';

        // html2canvasはfillText時点でブラウザにロード済みのフォントしか使えないため、
        // ここで確実に全フォントの読み込みを待ってから描画に進む
        try {
          await preloadAllFonts();
        } catch (e) {
          console.warn('フォントの事前読み込みに失敗しましたが処理を続行します。', e);
        }
        // fonts.readyの解決直後はまだ1フレーム分の再描画が反映されていないことがあるため、
        // 2フレーム分待って確実に画面にフォントが反映された状態にする
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        downloadBtn.textContent = '画像を生成中...';

        const guide = document.getElementById('design-guide');
        guide.style.display = 'none';

        const formElements = sheetBody.querySelectorAll('input, textarea');
        const replacements = [];

        // 個別コピーするプロパティ一覧
        // ※ getComputedStyle().cssText はFirefox/旧Edgeでは常に空文字列を返す仕様のため
        //   (Chrome/Safariでしか動かない)、丸ごとコピーはせず必要なプロパティだけ個別に移す
        const STYLE_PROPS = [
          'fontFamily', 'fontSize', 'fontWeight', 'fontStyle',
          'color', 'textAlign', 'lineHeight', 'letterSpacing'
        ];

        formElements.forEach(el => {
          const div = document.createElement('div');
          div.textContent = el.value || el.placeholder || '';

          const computedStyle = window.getComputedStyle(el);
          STYLE_PROPS.forEach(prop => {
            div.style[prop] = computedStyle[prop];
          });
          div.style.width = '100%';
          div.style.height = '100%';
          div.style.boxSizing = 'border-box';
          div.style.background = 'transparent';
          div.style.border = 'none';
          div.style.whiteSpace = el.tagName.toLowerCase() === 'textarea' ? 'pre-wrap' : 'nowrap';
          div.style.wordBreak = 'break-all';
          div.style.display = 'flex';
          div.style.alignItems = el.tagName.toLowerCase() === 'textarea' ? 'flex-start' : 'center';
          div.style.justifyContent = computedStyle.textAlign === 'center' ? 'center' : 'flex-start';

          if (!el.value) div.style.opacity = '0.5';

          el.style.display = 'none';
          el.parentNode.appendChild(div);
          replacements.push({ original: el, replica: div });
        });

        html2canvas(sheetBody, {
          scale: 2,
          useCORS: true,
          allowTaint: false,
          imageTimeout: 15000,
          logging: false
        }).then(canvas => {
          replacements.forEach(item => {
            item.replica.remove();
            item.original.style.display = '';
          });
          guide.style.display = '';

          const link = document.createElement('a');
          link.download = 'azurlane_card.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(err => {
          replacements.forEach(item => {
            item.replica.remove();
            item.original.style.display = '';
          });
          guide.style.display = '';
          alert('画像の保存に失敗しました。');
          console.error(err);
        }).finally(() => {
          downloadBtn.disabled = false;
          downloadBtn.textContent = originalBtnText;
        });
      });
    });
  </script>
</body>
