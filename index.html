  <!-- Google Fonts 読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">

  <style>
    /* 画面全体 */
    body {
      margin: 0;
      padding: 20px;
      background-color: #202020;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* 設定用パネル */
    .font-controls {
      background-color: #2a3442;
      border: 1px solid #445366;
      border-radius: 10px;
      padding: 15px 20px;
      width: 1000px;
      box-sizing: border-box;
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
    }

    .font-controls-title {
      width: 100%;
      font-weight: bold;
      font-size: 16px;
      color: #66b2ff;
      border-bottom: 1px solid #445366;
      padding-bottom: 5px;
      margin: 0;
    }

    .font-controls-subtitle {
      width: 100%;
      font-weight: bold;
      font-size: 14px;
      color: #aaccff;
      margin: 10px 0 0 0;
      border-left: 3px solid #66b2ff;
      padding-left: 8px;
    }

    /* 設定系要素の中央揃え設定 */
    .font-controls label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      text-align: center;
    }

    .font-controls select,
    .font-controls input[type="text"],
    .font-controls input[type="color"] {
      background-color: #1a222e;
      color: #fff;
      border: 1px solid #66b2ff;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 13px;
      outline: none;
      text-align: center;
      text-align-last: center; /* セレクトドロップダウン内の中央揃え */
    }

    .font-controls input[type="color"] {
      padding: 0;
      width: 32px;
      height: 28px;
      cursor: pointer;
    }

    /* 指揮官カード本体 */
    .sheet-body {
      position: relative;
      width: 1000px;
      height: 1800px;
      background: linear-gradient(135deg, #007FFF 0%, #FFFF00 100%);
      background-size: cover;
      background-position: center;
      box-sizing: border-box;
      padding: 30px;
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }

    /* 設計図ガイド */
    #design-guide {
      position: absolute;
      top: 0;
      left: 0;
      width: 1000px;
      height: 1780px;
      background: url('layout.png') no-repeat top center;
      background-size: contain;
      opacity: 0.2;
      pointer-events: none;
      z-index: 9999;
    }

    /* ドロップゾーン共通スタイル */
    .drop-zone {
      position: absolute;
      border: 3px dashed #66b2ff;
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      overflow: hidden;
    }

    .drop-zone.dragover {
      background-color: rgba(0, 123, 255, 0.4);
    }

    #drop-zone1 { top: 30px; left: 30px; width: 360px; height: 360px; }
    #drop-zone2 { top: 495px; left: 405px; width: 570px; height: 190px; }
    #drop-zone3 { top: 1060px; left: 30px; width: 400px; height: 400px; }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* 汎用入力コンテナ */
    .box-item {
      position: absolute;
      background-color: rgba(240, 240, 240, 0.2); /* 開発用背景色 */
      border-radius: 12px;
      padding: 35px 10px 10px 10px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 枠内ラベル */
    .box-item .label {
      position: absolute;
      top: 5px;
      left: 10px;
      color: #fff;
      text-decoration: underline;
      pointer-events: none;
      font-size: 20px;
      font-family: inherit;
    }

    /* 枠内入力フィールドの中央揃え適用部分 (修正: !important を除去) */
    .box-item input[type="text"],
    .box-item textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      resize: none;
      font-family: inherit;
      position: relative;
      z-index: 2;
      text-align: center; /* 入力文字の中央揃え */
    }

    /* 推し陣営専用 透かし画像背景レイヤー */
    #faction-bg-watermark {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('layout.png') no-repeat center center;
      background-size: contain;
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      transition: background-image 0.3s ease;
    }

    /* SNS専用エリアのレイアウト */
    .sns-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      gap: 10px;
    }

    #qrcode-display {
      background-color: #fff;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode-display img { display: block; }

    .x-id-display {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
    }
  </style>
</head>

<button id="download-btn" style="background-color: #66b2ff; color: #000; font-weight: bold; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer;">

  <script>
    // --- 画像アップロード共通セットアップ関数 ---
    function setupImageDropZone(zoneId, inputId, previewId) {
      const dropZone = document.getElementById(zoneId);
      const fileInput = document.getElementById(inputId);
      const preview = document.getElementById(previewId);

      function showPreview(file) {
        if (file && file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            dropZone.querySelector('span').style.display = 'none';
          };
          reader.readAsDataURL(file);
        } else {
          alert('画像ファイルを指定してください。');
        }
      }

      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => showPreview(e.target.files[0]));

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => e.preventDefault());
      });

      dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
          showPreview(e.dataTransfer.files[0]);
        }
      });
    }

    setupImageDropZone('drop-zone1', 'file-input1', 'preview1');
    setupImageDropZone('drop-zone2', 'file-input2', 'preview2');
    setupImageDropZone('drop-zone3', 'file-input3', 'preview3');


    document.addEventListener('DOMContentLoaded', () => {

      // 1. 背景色グラデーション変更
      const bgColorTop = document.getElementById('bg-color-top');
      const bgColorBottom = document.getElementById('bg-color-bottom');
      const sheetBody = document.getElementById('sheet-body');

      function updateBackgroundGradient() {
        sheetBody.style.background = `linear-gradient(135deg, ${bgColorTop.value} 0%, ${bgColorBottom.value} 100%)`;
      }

      bgColorTop.addEventListener('input', updateBackgroundGradient);
      bgColorBottom.addEventListener('input', updateBackgroundGradient);


      // 2. プルダウン連動 (テキスト入力 ＋ 透かし背景画像変更)
      const serverSelect = document.getElementById('server-select');
      const serverInput = document.getElementById('server-name-input');
      serverSelect.addEventListener('change', (e) => {
        serverInput.value = e.target.value;
      });

      const factionSelect = document.getElementById('faction-select');
      const factionInput = document.getElementById('faction-name-input');
      const factionWatermark = document.getElementById('faction-bg-watermark');

      factionSelect.addEventListener('change', (e) => {
        // テキスト枠への入力
        factionInput.value = e.target.value;

        // 透かし画像の変更 (data-img 属性から取得)
        const selectedOption = e.target.options[e.target.selectedIndex];
        const imgPath = selectedOption.getAttribute('data-img') || 'layout.png';
        factionWatermark.style.backgroundImage = `url('${imgPath}')`;
      });


      // 3. QRコード ＆ X ID
      const snsUrlInput = document.getElementById('sns-url-input');
      const snsIdInput = document.getElementById('sns-id-input');
      const qrDisplay = document.getElementById('qrcode-display');
      const xIdContainer = document.getElementById('x-id-container');
      const xIdText = document.getElementById('x-id-text');

      let qrcodeObj = null;

      function updateSNSDisplay() {
        const url = snsUrlInput.value.trim();
        const idText = snsIdInput.value.trim();

        if (url) {
          qrDisplay.style.display = 'flex';
          if (!qrcodeObj) {
            qrcodeObj = new QRCode(qrDisplay, {
              text: url,
              width: 130,
              height: 130,
              colorDark : "#000000",
              colorLight : "#ffffff",
              correctLevel : QRCode.CorrectLevel.H
            });
          } else {
            qrcodeObj.clear();
            qrcodeObj.makeCode(url);
          }
        } else {
          qrDisplay.style.display = 'none';
        }

        if (idText) {
          xIdContainer.style.display = 'flex';
          xIdText.textContent = idText.startsWith('@') ? idText : `@${idText}`;
        } else {
          xIdContainer.style.display = 'none';
        }
      }

      snsUrlInput.addEventListener('input', updateSNSDisplay);
      snsIdInput.addEventListener('input', updateSNSDisplay);


      // 4. フォント切替処理
      const fontSelects = document.querySelectorAll('.font-select');
      fontSelects.forEach((select) => {
        select.addEventListener('change', (e) => {
          const targetSelector = e.target.getAttribute('data-target');
          const targetElement = document.querySelector(targetSelector);
          const fontName = e.target.value;

          if (targetElement) {
            if (fontName === "") {
              targetElement.style.fontFamily = 'inherit';
            } else if (fontName === "serif" || fontName === "sans-serif") {
              targetElement.style.fontFamily = fontName;
            } else {
              targetElement.style.fontFamily = `"${fontName}", sans-serif`;
            }
          }
        });
      });


      // 5. サイズ切替処理
      const sizeSelects = document.querySelectorAll('.size-select');
      sizeSelects.forEach((select) => {
        select.addEventListener('change', (e) => {
          const targetSelector = e.target.getAttribute('data-target');
          const targetElement = document.querySelector(targetSelector);
          const sizeVal = e.target.value;

          if (targetElement) {
            if (sizeVal === "") {
              targetElement.style.fontSize = '';
            } else {
              targetElement.style.fontSize = sizeVal;
            }
          }
        });
      });
    
// 画像化 ＆ ダウンロード処理
      const downloadBtn = document.getElementById('download-btn');
      
      downloadBtn.addEventListener('click', () => {
        // 保存時に赤い「設計図ガイド」を一時的に非表示にする
        const guide = document.getElementById('design-guide');
        const originalDisplay = guide.style.display;
        guide.style.display = 'none';

        // ダウンロード実行
        html2canvas(sheetBody, {
          scale: 2, // 2倍解像度で綺麗に出力
          useCORS: true // 外部画像の読み込み許可
        }).then(canvas => {
          // 非表示にしたガイドを元に戻す
          guide.style.display = originalDisplay;

          // 画像としてダウンロードさせる処理
          const link = document.createElement('a');
          link.download = 'azurlane_card.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(err => {
          guide.style.display = originalDisplay;
          alert('画像の生成に失敗しました。');
          console.error(err);
        });
      });


      
    });
  </script>
